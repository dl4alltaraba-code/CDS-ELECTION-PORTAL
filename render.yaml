services:
  - type: web
    name: cds-election
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        value: admin_cds_2024
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
