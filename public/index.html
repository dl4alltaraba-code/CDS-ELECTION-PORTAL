<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DL4ALL CDS Election - Digital Literacy for All Jalingo Executive Elections">
  <title>DL4ALL CDS Election</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>">
</head>
<body>
  <div class="landing">
    <div class="landing__logos">
      <img src="/images/dl4all-logo.png" alt="DL4ALL Logo" class="landing__logo-main">
      <img src="/images/nysc-logo.png" alt="NYSC Logo" class="landing__logo-nysc">
    </div>

    <h1 class="landing__title">DL4ALL Jalingo Elections</h1>
    <p class="landing__subtitle">
      Digital Literacy for All — CDS Executive Election Portal. 
      Cast your vote securely and make your voice count.
    </p>

    <div class="landing__actions">
      <a href="/vote.html" id="btnStartVoting" class="btn btn-primary" style="width: auto; padding: 16px 40px; font-size: 1rem;">
        🗳️ &nbsp;Start Voting
      </a>
      <a href="/candidates.html" class="btn btn-outline" style="padding: 16px 32px;">
        👥 &nbsp;View Candidates
      </a>
      <a href="/results.html" id="btnViewResults" class="btn btn-secondary" style="padding: 16px 32px; width: 100%; margin-top: 12px;">
        🏆 &nbsp;View Live Results
      </a>
    </div>

    <span class="landing__badge">DL4ALL TARABA × NYSC &middot; Powered by Digital Literacy for All CDS JALINGO</span>
  </div>

  <script>
    (async () => {
      try {
        const res = await fetch(`/api/settings?_t=${Date.now()}`);
        if (res.ok) {
          const settings = await res.json();
          if (!settings.voting_enabled) {
            document.getElementById('btnStartVoting').style.display = 'none';
          }
          if (!settings.results_visible) {
            document.getElementById('btnViewResults').style.display = 'none';
          }
        }
      } catch (err) {
        console.error('Failed to load settings', err);
      }
    })();
  </script>
</body>
</html>
