<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet the DL4ALL CDS Election Candidates">
  <title>DL4ALL — Candidates</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👥</text></svg>">
</head>
<body>
  <div class="tree-page">
    <div class="tree-page__nav">
      <a href="/">← Back to Home</a>
      <a href="/vote.html" id="btnStartVoting">Start Voting →</a>
    </div>

    <div class="tree-page__header">
      <img src="/images/dl4all-logo.png" alt="DL4ALL" style="height: 36px; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(76,175,80,0.3));">
      <h1 class="header__title" style="font-size: 1.5rem; margin-bottom: 4px;">Meet the Candidates</h1>
      <p class="section-desc" style="margin-bottom: 0;">DL4ALL Jalingo Executive Election Aspirants</p>
    </div>

    <div id="candidatesTree">
      <p style="text-align: center; color: var(--text-muted); padding: 40px 0;">Loading candidates...</p>
    </div>
  </div>

  <footer class="footer" style="text-align: center; padding: 32px 16px;">
    <p>DL4ALL JALINGO Election Portal &copy; 2026 &middot; <a href="/">Home</a></p>
  </footer>

  <script>
    (async () => {
      try {
        const res = await fetch('/api/candidates');
        const data = await res.json();
        const container = document.getElementById('candidatesTree');
        container.innerHTML = '';

        data.positions.forEach(posGroup => {
          const section = document.createElement('div');
          section.className = 'tree-section';

          section.innerHTML = '<div class="tree-section__title"><span class="tree-section__badge">' +
            escapeHtml(posGroup.position) + ' (' + posGroup.candidates.length + ')</span></div>';

          const timeline = document.createElement('div');
          timeline.className = 'tree-timeline';

          posGroup.candidates.forEach((c, i) => {
            const side = i % 2 === 0 ? 'left' : 'right';
            const node = document.createElement('div');
            node.className = 'tree-node tree-node--' + side;

            const initials = c.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
            const photoHtml = c.image_url
              ? '<img src="' + escapeHtml(c.image_url) + '" alt="' + escapeHtml(c.name) + '" class="tree-card__photo" onerror="this.outerHTML=\'<div class=tree-card__photo-placeholder>' + initials + '</div>\'">'
              : '<div class="tree-card__photo-placeholder">' + initials + '</div>';

            const manifesto = c.manifesto || 'No manifesto provided.';
            const cardId = 'manifesto-' + c.id;

            node.innerHTML = '<div class="tree-card">' +
              '<div class="tree-card__header">' +
                photoHtml +
                '<div>' +
                  '<div class="tree-card__name">' + escapeHtml(c.name) + '</div>' +
                  '<div class="tree-card__position">' + escapeHtml(c.position) + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="tree-card__manifesto" id="' + cardId + '">' + escapeHtml(manifesto) + '</div>' +
              '<button class="tree-card__toggle" onclick="toggleManifesto(\'' + cardId + '\', this)">Read more</button>' +
            '</div>';

            timeline.appendChild(node);
          });

          section.appendChild(timeline);
          container.appendChild(section);
        });
      } catch (err) {
        document.getElementById('candidatesTree').innerHTML =
          '<p style="text-align:center;color:var(--error);padding:40px;">Failed to load candidates.</p>';
      }
    })();

    function toggleManifesto(id, btn) {
      const el = document.getElementById(id);
      el.classList.toggle('expanded');
      btn.textContent = el.classList.contains('expanded') ? 'Show less' : 'Read more';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Hide Start Voting button if disabled
    (async () => {
      try {
        const res = await fetch(`/api/settings?_t=${Date.now()}`);
        if (res.ok) {
          const settings = await res.json();
          if (!settings.candidates_voting_visible) {
            const btn = document.getElementById('btnStartVoting');
            if (btn) btn.style.display = 'none';
          }
        }
      } catch (err) {
        console.error('Failed to load settings', err);
      }
    })();
  </script>
</body>
</html>
