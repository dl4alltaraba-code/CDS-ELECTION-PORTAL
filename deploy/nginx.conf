# Save as /etc/nginx/sites-available/cds-election, then:
#   sudo ln -s /etc/nginx/sites-available/cds-election /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Replace vote.example.org with your domain.

server {
    listen 80;
    server_name vote.example.org;

    client_max_body_size 10m;   # voter CSV uploads

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After certbot runs (sudo certbot --nginx -d vote.example.org), HTTPS is added
# and HTTP redirects to it.
